<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Gate: Вход в системата</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --border-subtle: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --input: #f8fafc;
            --font-sans: Montserrat, system-ui, -apple-system, sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        [data-theme="dark"], body.dark-mode {
            --bg-body: #090d16;
            --bg-card: #131b2e;
            --border: #1e293b;
            --border-subtle: #192237;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: rgba(59, 130, 246, 0.12);
            --input: #0b1120;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-sans);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- FLOATING THEME TOGGLE BUTTON -->
    <div class="fixed top-5 right-5 z-20">
        <button type="button" onclick="toggleTheme()" id="themeToggleBtn" title="Смяна на светла/тъмна тема" class="p-2.5 rounded-xl bg-[var(--bg-card)] border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--text-main)] hover:border-blue-500 shadow-sm transition cursor-pointer flex items-center justify-center">
            <!-- Sun icon for light mode -->
            <svg id="themeSunIcon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <!-- Moon icon for dark mode -->
            <svg id="themeMoonIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
    </div>

    <!-- MAIN LOGIN CARD -->
    <div class="bg-[var(--bg-card)] border border-[var(--border)] p-8 sm:p-10 rounded-2xl w-full max-w-md shadow-xl transition-all relative z-10">
        
        <!-- BRAND HEADER -->
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-13 h-13 rounded-2xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/25 mb-4">
                <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <div class="space-y-1">
                <div class="text-[11px] uppercase tracking-widest font-bold text-blue-600 dark:text-blue-400">ТУ - София • Exam Gate</div>
                <h2 id="loginTitle" class="text-2xl font-extrabold text-[var(--text-main)] tracking-tight">Вход в системата</h2>
                <p id="loginSubtitle" class="text-xs text-[var(--text-muted)] leading-relaxed">Изберете роля и влезте в съответния панел</p>
            </div>
        </div>

        <!-- SEGMENTED ROLE SWITCHER (NO EMOJIS, CLEAN SVG ICONS) -->
        <div class="mb-6">
            <label class="text-[11px] text-[var(--text-muted)] block uppercase font-bold mb-2 tracking-wider">Избор на роля</label>
            <div class="bg-slate-100 dark:bg-slate-900 p-1.5 rounded-xl flex items-center border border-[var(--border)] select-none">
                <button type="button" id="roleBtnExaminer" onclick="selectRole('examiner')" class="flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span>Квестор</span>
                </button>
                <button type="button" id="roleBtnAdmin" onclick="selectRole('admin')" class="flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    <span>Администратор</span>
                </button>
            </div>
            <input type="hidden" id="role" name="role" value="examiner">
        </div>

        <form id="loginForm" class="space-y-4">
            <!-- EMAIL FIELD -->
            <div>
                <label class="text-[11px] text-[var(--text-muted)] block uppercase font-bold mb-1.5 tracking-wider">Институционален имейл</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[var(--text-muted)]">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                        </svg>
                    </div>
                    <input type="email" id="email" required placeholder="напр. user@tu-sofia.bg" class="w-full bg-[var(--input)] border border-[var(--border)] rounded-xl pl-10 pr-4 py-2.5 text-sm text-[var(--text-main)] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
            </div>
            
            <!-- PASSWORD FIELD WITH EYE TOGGLE -->
            <div>
                <label class="text-[11px] text-[var(--text-muted)] block uppercase font-bold mb-1.5 tracking-wider">Парола</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[var(--text-muted)]">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[var(--input)] border border-[var(--border)] rounded-xl pl-10 pr-11 py-2.5 text-sm text-[var(--text-main)] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    
                    <!-- Show/Hide Password Button with Clean SVG icons -->
                    <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', 'eyeIcon', 'eyeSlashIcon')" title="Покажи/Скрий парола" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition cursor-pointer">
                        <svg id="eyeIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeSlashIcon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- ERROR MESSAGE -->
            <div id="errorMessage" class="hidden text-xs bg-red-500/10 border border-red-500/25 text-red-600 dark:text-red-400 p-3 rounded-xl text-center font-medium leading-relaxed"></div>

            <!-- SUBMIT BUTTON WITH SPINNER -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-blue-500/20 hover:shadow-lg hover:shadow-blue-500/30 transition-all transform active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2 mt-2">
                <span id="btnText">Влез в системата</span>
                <span id="btnSpinner" style="display: none;" class="items-center gap-2">
                    <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>Влизане...</span>
                </span>
            </button>

            <!-- NAVIGATION TO REGISTER -->
            <div class="text-center pt-3 mt-4 border-t border-[var(--border)]">
                <a href="/register" class="inline-flex items-center gap-1.5 text-xs text-[var(--text-muted)] hover:text-blue-600 dark:hover:text-blue-400 font-medium transition">
                    <span>Нямате акаунт?</span>
                    <span class="text-blue-600 dark:text-blue-400 font-semibold underline underline-offset-2">Регистрирайте се тук</span>
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
        </form>
    </div>

    <!-- FOOTER COPYRIGHT -->
    <div class="text-center text-[11px] text-[var(--text-muted)] mt-6 relative z-10">
        &copy; 2026 ТУ - София • Academic Access Control & Authentication System (AACAS)
    </div>

    <script>
        const defaultRole = "{{ default_role|default('examiner') }}";
        const roleInput = document.getElementById("role");
        const roleBtnExaminer = document.getElementById("roleBtnExaminer");
        const roleBtnAdmin = document.getElementById("roleBtnAdmin");
        const loginTitle = document.getElementById("loginTitle");
        const loginSubtitle = document.getElementById("loginSubtitle");
        const submitBtn = document.getElementById("submitBtn");
        const btnText = document.getElementById("btnText");
        const btnSpinner = document.getElementById("btnSpinner");
        const errorDiv = document.getElementById("errorMessage");

        // THEME MANAGEMENT (LIGHT / DARK)
        function applyTheme(isDark) {
            const sunIcon = document.getElementById("themeSunIcon");
            const moonIcon = document.getElementById("themeMoonIcon");
            if (isDark) {
                document.documentElement.setAttribute("data-theme", "dark");
                document.body.classList.add("dark-mode");
                if (sunIcon) sunIcon.classList.remove("hidden");
                if (moonIcon) moonIcon.classList.add("hidden");
                localStorage.setItem("theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
                document.body.classList.remove("dark-mode");
                if (sunIcon) sunIcon.classList.add("hidden");
                if (moonIcon) moonIcon.classList.remove("hidden");
                localStorage.setItem("theme", "light");
            }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem("theme") || document.documentElement.getAttribute("data-theme") || "light";
            applyTheme(currentTheme !== "dark");
        }

        // Initialize Theme from localStorage or system preference
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            applyTheme(true);
        } else {
            applyTheme(false);
        }

        // ROLE SWITCHER LOGIC
        function selectRole(role) {
            roleInput.value = role;
            if (role === "admin") {
                roleBtnAdmin.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer bg-blue-600 text-white shadow-sm shadow-blue-500/25";
                roleBtnExaminer.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer text-[var(--text-muted)] hover:text-[var(--text-main)]";
                loginTitle.innerText = "Вход за администратори";
                loginSubtitle.innerText = "Достъп до административния панел на Exam Gate";
            } else {
                roleBtnExaminer.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer bg-blue-600 text-white shadow-sm shadow-blue-500/25";
                roleBtnAdmin.className = "flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer text-[var(--text-muted)] hover:text-[var(--text-main)]";
                loginTitle.innerText = "Вход за квестори";
                loginSubtitle.innerText = "Система за биометричен контрол на изпити";
            }
        }

        // Set initial role
        selectRole(defaultRole === "admin" ? "admin" : "examiner");

        // PASSWORD VISIBILITY TOGGLER
        function togglePasswordVisibility(inputId, eyeIconId, eyeSlashIconId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeIconId);
            const eyeSlash = document.getElementById(eyeSlashIconId);
            if (input.type === "password") {
                input.type = "text";
                eye.classList.add("hidden");
                eyeSlash.classList.remove("hidden");
            } else {
                input.type = "password";
                eye.classList.remove("hidden");
                eyeSlash.classList.add("hidden");
            }
        }

        // FORM SUBMISSION
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            errorDiv.classList.add("hidden");
            errorDiv.innerText = "";
            const role = roleInput.value;

            // Loading state
            submitBtn.disabled = true;
            btnText.style.display = "none";
            btnSpinner.style.display = "inline-flex";

            const formData = new URLSearchParams();
            formData.append("email", document.getElementById("email").value.trim());
            formData.append("password", document.getElementById("password").value);
            formData.append("role", role);

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    if (role === "admin") {
                        localStorage.setItem("admin_token", data.access_token);
                        window.location.href = window.location.origin + "/admins/dashboard";
                    } else {
                        localStorage.setItem("examiner_token", data.access_token);
                        window.location.href = window.location.origin + "/examiner/lobby";
                    }
                } else {
                    errorDiv.innerText = data.detail || "Грешка при вход в системата.";
                    errorDiv.classList.remove("hidden");
                }
            } catch (err) {
                errorDiv.innerText = "Няма връзка с бекенд сървъра.";
                errorDiv.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                btnText.style.display = "";
                btnSpinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
